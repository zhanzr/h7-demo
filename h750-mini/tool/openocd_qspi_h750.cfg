# OpenOCD config: STM32H750 + W25Q64 on QUADSPI, using the Keil ULINK2
# (CMSIS-DAP, SWD), flashed through the built-in `stmqspi` driver.
#
# !!! KNOWN BLOCKER (do not expect this to work) !!!
# The H750 QUADSPI only works with PLL2 as the kernel clock. D1HCLK (QSPISEL=0)
# returns garbage (verified: memory-mapped reads at 0x90000000 come back as
# 0x7d425cc4... instead of the flash content), and PLL2 cannot be locked by
# register pokes from a halted CPU - it needs the CPU to run the full clock-init
# sequence. The working external-flash paths are:
#   * probe-rs custom bit-banged-SPI algorithm (qspi_map/algo/) - runs on HSI,
#     no PLL, self-verifying. RECOMMENDED.
#   * a RAM-loaded burner firmware (h7-qspi-loader style) run by the CPU.
# This stmqspi config is kept for reference: it resets the flash and aborts the
# memmap state correctly, but the D1HCLK clock means the flash never responds.
#
# Usage (would be, if the clock blocker were solved):
#   openocd -f tools/openocd_qspi_h750.cfg \
#           -c "program h750-mini/qspi_map/build/app.hex verify reset exit"

# MUST be set BEFORE sourcing the target: creates the stmqspi flash bank.
set QUADSPI 1

adapter driver cmsis-dap
adapter serial V0010M9E

transport select swd
reset_config srst_nogate

source [find target/stm32h7x.cfg]

set _QSPI $_CHIPNAME.qspi

proc qspi_reset_init {} {
    global _QSPI

    # The bootloader firmware enables the I/D caches; after halt the debugger's
    # memory reads/writes would then see stale lines. Disable + invalidate.
    mww 0xE0041000 0x00000000              ;# ICACHE CTRL = disabled
    mww 0xE0042000 0x00000000              ;# DCACHE CTRL = disabled
    mww 0xE0041014 0x00000001              ;# ICACHE invalidation
    mww 0xE0042014 0x00000001              ;# DCACHE invalidation
    sleep 1

    # RCC (base 0x58024400)
    #   AHB3ENR (0xD4) bit14: QUADSPI clock enable
    mmw 0x580244D4 0x00004000 0
    #   AHB4ENR (0xE0) bits 1/3/4: GPIOB/GPIOD/GPIOE clocks
    mmw 0x580244E0 0x0000001A 0

    # RCC (base 0x58024400)
    #   AHB3ENR (0xD4) bit14: QUADSPI clock enable
    mmw 0x580244D4 0x00004000 0
    #   AHB4ENR (0xE0) bits 1/3/4: GPIOB/GPIOD/GPIOE clocks
    mmw 0x580244E0 0x0000001A 0

    # QSPI kernel clock = D1HCLK (QSPISEL=0 is the reset default; 32 MHz after
    # reset with HSI 64 MHz / HPRE 2). No PLL is needed - enabling PLL2 from a
    # halted CPU proved unreliable and could wedge the AP. D1HCLK is slower but
    # rock solid.
    mmw 0x5802444C 0x00000000 0x00000030   ;# D1CCIPR QSPISEL = 00 (D1HCLK)
    sleep 1

    # GPIOB (0x58020400): PB2=QUADSPI_CLK AF9, PB6=BK1_NCS AF10
    # H7 GPIO resets to analog (0xFFFFFFFF); use full-value writes so the
    # target pins are exactly right (mmw RMW left PB6 as analog -> no NCS).
    mww 0x58020400 0xFFFFEFEF              ;# MODER: PB2/PB6 = AF (10), rest analog
    mww 0x58020408 0x00003030              ;# OSPEEDR: PB2/PB6 very high
    mww 0x5802040C 0x00000000              ;# PUPDR: none
    mww 0x58020420 0x00000900              ;# AFRL: PB2=9
    mww 0x58020424 0x000000A0              ;# AFRH: PB6=10

    # GPIOD (0x58020C00): PD11/PD12/PD13 = IO0/IO1/IO3 AF9
    mww 0x58020C00 0xFABFFFFF              ;# MODER: PD11/12/13 = AF, rest analog
    mww 0x58020C08 0x0FC00000              ;# OSPEEDR: PD11/12/13 very high
    mww 0x58020C0C 0x00000000              ;# PUPDR: none
    mww 0x58020C24 0x00099900              ;# AFRH: PD11/12/13 = 9

    # GPIOE (0x58021000): PE2 = IO2 AF9
    mww 0x58021000 0xFFFFFFEF              ;# MODER: PE2 = AF, rest analog
    mww 0x58021008 0x00000030              ;# OSPEEDR: PE2 very high
    mww 0x5802100C 0x00000000              ;# PUPDR: none
    mww 0x58021020 0x00000900              ;# AFRL: PE2=9

    # QUADSPI (base 0x52005000). Enable it FIRST (DCR+CR), then reset the flash,
    # then switch to memory-mapped 1-line read (0x03).
    #   DCR: FSIZE[20:16]=22 (8 MB), CSHT[10:8]=0 (1 cyc), CKMODE[0]=1 (mode 3)
    mww 0x52005004 0x00160001
    #   CR: EN[0]=1 TCEN[3]=1 PRESCALER[31:24]=1 (32 MHz)
    mww 0x52005000 0x01000009

    # The QUADSPI is left BUSY in memory-mapped mode by the bootloader/app that
    # ran before. Abort it (CR.ABORT) and wait BUSY clear, otherwise the reset
    # commands below are ignored and the flash stays in continuous-read mode.
    mmw 0x52005000 0x00000002 0            ;# set CR.ABORT (bit 1)
    sleep 1
    set q_sr [mrw 0x52005018]
    while {[expr {$q_sr & 2}]} {
        set q_sr [mrw 0x52005018]
    }
    mmw 0x52005000 0 0x00000002            ;# clear CR.ABORT

    # Reset the W25Q64 (0x66 enable-reset, then 0x99 reset) in indirect mode.
    # The running app leaves the flash in continuous-read mode, so without this
    # the first 0x05 status read returns garbage (WIP stuck) and the stmqspi
    # driver fails with "Cannot write enable flash1. Status=0x73/0xdd".
    #   CCR: INSTR=<cmd> IMODE=01 FMODE=00 (indirect write, command only)
    mww 0x52005014 0x00000166              ;# 0x66 reset enable
    sleep 1
    mww 0x52005014 0x00000199              ;# 0x99 reset memory
    sleep 1

    # IMPORTANT: the stmqspi driver derives the indirect status/program/erase
    # command line modes from this memmap CCR, so it MUST be 1-line (a 4-line
    # memmap read like 0xEB would make the 0x05 status read go out on 4 lines
    # and the flash would stop responding -> BUSY timeout).
    #   CCR: INSTR[7:0]=0x03 IMODE[9:8]=1 ADMODE[11:10]=1 ADSIZE[13:12]=2 \
    #        ABMODE=0 ABSIZE=0 DCYC=0 DMODE[25:24]=1 FMODE[27:26]=3 (memmap)
    mww 0x52005014 0x0D002503
    mww 0x5200501C 0x00000000              ;# ABR: none for 1-line read
    mww 0x52005030 0x00000010              ;# LPTR: low-power timeout period
    sleep 1

    # Define the W25Q64 geometry for the stmqspi driver. NOTE: do NOT follow
    # this with "flash probe": stmqspi_probe() resets bank->size to 0 and, since
    # the W25Q64 has no auto-detectable ID, leaves it 0 (auto_probe skips the
    # already-probed bank, so the size set here is what the writer uses).
    stmqspi set $_QSPI w25q64 0x800000 256 0x03 0xEB 0x02 0xC7 0x1000 0x20
}

$_CHIPNAME.cpu0 configure -event reset-init { qspi_reset_init }
