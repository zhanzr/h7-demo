# OpenOCD interface config for the Keil ULINK2 (enumerates as CMSIS-DAP).
#
# Usage:
#   openocd -f tools/openocd_ulink2.cfg -c "init; halt; <cmds>; shutdown"
#
# The ULINK2 shows up as a CMSIS-DAP probe (VID 0xC251, PID 0x2722,
# serial V0010M9E). This board talks SWD to an STM32H7x.

adapter driver cmsis-dap
adapter serial V0010M9E

transport select swd

# This board has no usable SRST line to the SWD connector.
reset_config srst_nogate

source [find target/stm32h7x.cfg]
